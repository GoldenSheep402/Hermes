syntax = "proto3";
package system.v1;
option go_package = "github.com/GoldenSheep402/Hermes/pkg/proto/system/v1;systemV1";

import "google/api/annotations.proto";

// ─── Messages ───────────────────────────────────────────────────────────────

message Setting {
  string key = 1;
  string value = 2;
  string type = 3;
  string desc = 4;
}

// ─── Service ────────────────────────────────────────────────────────────────

service SystemService {
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse) {
    option (google.api.http) = {
      post : "/gapi/system/v1/settings/get"
      body : "*"
    };
  }

  rpc GetSetting(GetSettingRequest) returns (GetSettingResponse) {
    option (google.api.http) = {
      post : "/gapi/system/v1/setting/get"
      body : "*"
    };
  }

  rpc SetSettings(SetSettingsRequest) returns (SetSettingsResponse) {
    option (google.api.http) = {
      post : "/gapi/system/v1/settings/set"
      body : "*"
    };
  }

  rpc DeleteSetting(DeleteSettingRequest) returns (DeleteSettingResponse) {
    option (google.api.http) = {
      post : "/gapi/system/v1/setting/delete"
      body : "*"
    };
  }

  rpc GetSiteStats(GetSiteStatsRequest) returns (GetSiteStatsResponse) {
    option (google.api.http) = {
      post : "/gapi/system/v1/stats"
      body : "*"
    };
  }
}

// ─── Requests / Responses ───────────────────────────────────────────────────

message GetSettingsRequest {}
message GetSettingsResponse { repeated Setting settings = 1; }

message GetSettingRequest { string key = 1; }
message GetSettingResponse { Setting setting = 1; }

message SetSettingsRequest { repeated Setting settings = 1; }
message SetSettingsResponse {}

message DeleteSettingRequest { string key = 1; }
message DeleteSettingResponse {}

message GetSiteStatsRequest {}
message GetSiteStatsResponse {
  int64 totalUsers = 1;
  int64 totalTorrents = 2;
  int64 totalResources = 3;
  int64 totalTraffic = 4;
  int64 totalSeeders = 5;
  int64 totalLeechers = 6;
}