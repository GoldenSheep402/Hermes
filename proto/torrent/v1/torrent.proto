syntax = "proto3";
package torrent.v1;
option go_package = "github.com/GoldenSheep402/Hermes/pkg/proto/torrent/v1;torrentV1";

import "google/api/annotations.proto";

// ─── Messages ───────────────────────────────────────────────────────────────

message TorrentInfo {
  string id = 1;
  string infoHash = 2;
  string uploaderId = 3;
  string name = 4;
  int64 size = 5;
  bool isSingleFile = 6;
  int32 fileCount = 7;
  int32 seedCount = 8;
  int32 leechCount = 9;
  int32 snatchCount = 10;
  bool isActive = 11;
  string createdAt = 12;
}

message TorrentFile {
  string id = 1;
  string torrentId = 2;
  string path = 3;
  int64 size = 4;
}

// ─── Service ────────────────────────────────────────────────────────────────

service TorrentService {
  rpc UploadTorrent(UploadTorrentRequest) returns (UploadTorrentResponse) {
    option (google.api.http) = {
      post : "/gapi/torrent/v1/upload"
      body : "*"
    };
  }

  rpc DownloadTorrent(DownloadTorrentRequest)
      returns (DownloadTorrentResponse) {
    option (google.api.http) = {
      post : "/gapi/torrent/v1/download"
      body : "*"
    };
  }

  rpc GetTorrent(GetTorrentRequest) returns (GetTorrentResponse) {
    option (google.api.http) = {
      post : "/gapi/torrent/v1/info"
      body : "*"
    };
  }

  rpc ListTorrentFiles(ListTorrentFilesRequest)
      returns (ListTorrentFilesResponse) {
    option (google.api.http) = {
      post : "/gapi/torrent/v1/files"
      body : "*"
    };
  }

  rpc DeleteTorrent(DeleteTorrentRequest) returns (DeleteTorrentResponse) {
    option (google.api.http) = {
      post : "/gapi/torrent/v1/delete"
      body : "*"
    };
  }
}

// ─── Requests / Responses ───────────────────────────────────────────────────

message UploadTorrentRequest { bytes torrentData = 1; }
message UploadTorrentResponse {
  string torrentId = 1;
  string infoHash = 2;
}

message DownloadTorrentRequest { string torrentId = 1; }
message DownloadTorrentResponse { bytes torrentData = 1; }

message GetTorrentRequest { string id = 1; }
message GetTorrentResponse { TorrentInfo torrent = 1; }

message ListTorrentFilesRequest { string torrentId = 1; }
message ListTorrentFilesResponse { repeated TorrentFile files = 1; }

message DeleteTorrentRequest { string id = 1; }
message DeleteTorrentResponse {}