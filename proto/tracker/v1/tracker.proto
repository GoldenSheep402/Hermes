syntax = "proto3";
package tracker.v1;
option go_package = "github.com/GoldenSheep402/Hermes/pkg/proto/tracker/v1;trackerV1";

import "google/api/annotations.proto";

// ─── Messages ───────────────────────────────────────────────────────────────

message PeerInfo {
  bytes peerId = 1;
  string ip = 2;
  int32 port = 3;
}

message SnatchInfo {
  string id = 1;
  string torrentId = 2;
  string userId = 3;
  int64 uploaded = 4;
  int64 downloaded = 5;
  int64 seedTime = 6;
  bool isActive = 7;
  string finishedAt = 8;
  string lastAction = 9;
}

// ─── Service ────────────────────────────────────────────────────────────────

service TrackerService {
  rpc GetTorrentPeers(GetTorrentPeersRequest)
      returns (GetTorrentPeersResponse) {
    option (google.api.http) = {
      post : "/gapi/tracker/v1/peers"
      body : "*"
    };
  }

  rpc ListSnatches(ListSnatchesRequest) returns (ListSnatchesResponse) {
    option (google.api.http) = {
      post : "/gapi/tracker/v1/snatches"
      body : "*"
    };
  }

  rpc GetUserSnatches(GetUserSnatchesRequest)
      returns (GetUserSnatchesResponse) {
    option (google.api.http) = {
      post : "/gapi/tracker/v1/user/snatches"
      body : "*"
    };
  }
}

// ─── Requests / Responses ───────────────────────────────────────────────────

message GetTorrentPeersRequest { string torrentId = 1; }
message GetTorrentPeersResponse {
  int32 seederCount = 1;
  int32 leecherCount = 2;
  repeated PeerInfo seeders = 3;
  repeated PeerInfo leechers = 4;
}

message ListSnatchesRequest {
  string torrentId = 1;
  int32 page = 2;
  int32 pageSize = 3;
}
message ListSnatchesResponse {
  repeated SnatchInfo snatches = 1;
  int64 total = 2;
}

message GetUserSnatchesRequest {
  string userId = 1;
  int32 page = 2;
  int32 pageSize = 3;
}
message GetUserSnatchesResponse {
  repeated SnatchInfo snatches = 1;
  int64 total = 2;
}

// ─── Announce/Scrape ────────────────────────────────────────────────────────

message AnnounceRequest {
  string passkey = 1;
  string infoHash = 2;
  string peerId = 3;
  int32 port = 4;
  int64 uploaded = 5;
  int64 downloaded = 6;
  int64 left = 7;
  string event = 8;
  string ip = 9;
  int32 numWant = 10;
  int32 compact = 11;
}

message AnnounceResponse {
  string failureReason = 1;
  string warningMessage = 2;
  int32 interval = 3;
  int32 minInterval = 4;
  int32 complete = 5;
  int32 incomplete = 6;
  repeated PeerInfo peers = 7;
  bytes peersCompact = 8;
}

message ScrapeRequest {
  string passkey = 1;
  repeated string infoHashes = 2;
}

message ScrapeFile {
  int32 complete = 1;
  int32 incomplete = 2;
  int32 downloaded = 3;
}

message ScrapeResponse { map<string, ScrapeFile> files = 1; }
