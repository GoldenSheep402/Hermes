syntax = "proto3";
package traffic.v1;
option go_package = "github.com/GoldenSheep402/Hermes/pkg/proto/traffic/v1;trafficV1";

import "google/api/annotations.proto";

// ─── Messages ───────────────────────────────────────────────────────────────

message TransferHistoryItem {
  string id = 1;
  string torrentId = 2;
  string torrentName = 3;
  int64 uploaded = 4;
  int64 downloaded = 5;
  int64 seedTime = 6;
  bool isFinished = 7;
  bool isActive = 8;
  string lastAction = 9;
}

message TorrentStatsInfo {
  string torrentId = 1;
  int32 seedCount = 2;
  int32 leechCount = 3;
  int32 snatchCount = 4;
  int64 totalUpload = 5;
  int64 totalDownload = 6;
}

message StreamSiteTrafficRequest {
  int32 intervalSeconds = 1;
  double smoothingFactor = 2;
}

message SiteTrafficRatePoint {
  string timestamp = 1;
  int64 uploadRate = 2;
  int64 downloadRate = 3;
  int64 rawUploadRate = 4;
  int64 rawDownloadRate = 5;
}

// ─── Service ────────────────────────────────────────────────────────────────

service TrafficService {
  rpc ListTransferHistory(ListTransferHistoryRequest)
      returns (ListTransferHistoryResponse) {
    option (google.api.http) = {
      post : "/gapi/traffic/v1/history"
      body : "*"
    };
  }

  rpc GetTorrentStats(GetTorrentStatsRequest)
      returns (GetTorrentStatsResponse) {
    option (google.api.http) = {
      post : "/gapi/traffic/v1/torrent"
      body : "*"
    };
  }

  rpc StreamSiteTraffic(StreamSiteTrafficRequest)
      returns (stream SiteTrafficRatePoint) {
    option (google.api.http) = { get : "/gapi/traffic/v1/site/stream" };
  }
}

// ─── Requests / Responses ───────────────────────────────────────────────────

message ListTransferHistoryRequest {
  string userId = 1;
  int32 page = 2;
  int32 pageSize = 3;
}
message ListTransferHistoryResponse {
  repeated TransferHistoryItem items = 1;
  int64 total = 2;
}

message GetTorrentStatsRequest { string torrentId = 1; }
message GetTorrentStatsResponse { TorrentStatsInfo stats = 1; }
