syntax = "proto3";
package user.v1;
option go_package = "github.com/GoldenSheep402/Hermes/pkg/proto/user/v1;userV1";

import "google/api/annotations.proto";

// ─── Messages ───────────────────────────────────────────────────────────────

message User {
  string id = 1;
  string username = 2;
  string email = 3;
  string avatar = 4;
  bool isAdmin = 5;
  bool isEnabled = 6;
  string groupId = 7;
  int64 bonusPoints = 8;
  int64 uploaded = 9;
  int64 downloaded = 10;
  int64 seedTime = 11;
  int32 inviteCount = 12;
  string passkey = 13;
  string lastLogin = 14;
  string createdAt = 15;
}

message UserGroup {
  string id = 1;
  string name = 2;
  string description = 3;
  int32 level = 4;
  int64 minUpload = 5;
  double minRatio = 6;
  int64 minSeedTime = 7;
  int32 maxDownloads = 8;
  bool canUpload = 9;
  bool canInvite = 10;
  bool isImmuneToRatio = 11;
  string color = 12;
  string icon = 13;
}

// ─── Service ────────────────────────────────────────────────────────────────

service UserService {
  rpc GetUser(GetUserRequest) returns (GetUserResponse) {
    option (google.api.http) = {
      post : "/gapi/user/v1/info"
      body : "*"
    };
  }

  rpc GetUserProfile(GetUserProfileRequest) returns (GetUserProfileResponse) {
    option (google.api.http) = {
      post : "/gapi/user/v1/profile"
      body : "*"
    };
  }

  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse) {
    option (google.api.http) = {
      put : "/gapi/user/v1/info"
      body : "*"
    };
  }

  rpc UpdatePassword(UpdatePasswordRequest) returns (UpdatePasswordResponse) {
    option (google.api.http) = {
      post : "/gapi/user/v1/password"
      body : "*"
    };
  }

  rpc ResetPasskey(ResetPasskeyRequest) returns (ResetPasskeyResponse) {
    option (google.api.http) = {
      post : "/gapi/user/v1/passkey/reset"
      body : "*"
    };
  }

  rpc GetUserPasskey(GetUserPasskeyRequest) returns (GetUserPasskeyResponse) {
    option (google.api.http) = {
      post : "/gapi/user/v1/passkey"
      body : "*"
    };
  }

  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {
      post : "/gapi/user/v1/list"
      body : "*"
    };
  }

  rpc CreateUserGroup(CreateUserGroupRequest)
      returns (CreateUserGroupResponse) {
    option (google.api.http) = {
      post : "/gapi/user/v1/group/create"
      body : "*"
    };
  }

  rpc GetUserGroup(GetUserGroupRequest) returns (GetUserGroupResponse) {
    option (google.api.http) = {
      post : "/gapi/user/v1/group/get"
      body : "*"
    };
  }

  rpc ListUserGroups(ListUserGroupsRequest) returns (ListUserGroupsResponse) {
    option (google.api.http) = {
      post : "/gapi/user/v1/group/list"
      body : "*"
    };
  }

  rpc UpdateUserGroup(UpdateUserGroupRequest)
      returns (UpdateUserGroupResponse) {
    option (google.api.http) = {
      post : "/gapi/user/v1/group/update"
      body : "*"
    };
  }

  rpc DeleteUserGroup(DeleteUserGroupRequest)
      returns (DeleteUserGroupResponse) {
    option (google.api.http) = {
      post : "/gapi/user/v1/group/delete"
      body : "*"
    };
  }
}

// ─── User Requests/Responses ────────────────────────────────────────────────

message GetUserRequest {}
message GetUserResponse { User user = 1; }

message GetUserProfileRequest { string id = 1; }
message GetUserProfileResponse {
  User user = 1;
  int64 realUpload = 2;
  int64 realDownload = 3;
  double ratio = 4;
  int32 publishedCount = 5;
  int32 seedingCount = 6;
  int32 downloadCount = 7;
}

message UpdateUserRequest {
  string username = 1;
  string avatar = 2;
}
message UpdateUserResponse { User user = 1; }

message UpdatePasswordRequest {
  string oldPassword = 1;
  string newPassword = 2;
}
message UpdatePasswordResponse {}

message ResetPasskeyRequest {}
message ResetPasskeyResponse { string passkey = 1; }

message GetUserPasskeyRequest {}
message GetUserPasskeyResponse { string passkey = 1; }

message ListUsersRequest {
  int32 page = 1;
  int32 pageSize = 2;
}
message ListUsersResponse {
  repeated User users = 1;
  int64 total = 2;
}

// ─── UserGroup Requests/Responses ───────────────────────────────────────────

message CreateUserGroupRequest { UserGroup group = 1; }
message CreateUserGroupResponse {}

message GetUserGroupRequest { string id = 1; }
message GetUserGroupResponse { UserGroup group = 1; }

message ListUserGroupsRequest {}
message ListUserGroupsResponse { repeated UserGroup groups = 1; }

message UpdateUserGroupRequest { UserGroup group = 1; }
message UpdateUserGroupResponse {}

message DeleteUserGroupRequest { string id = 1; }
message DeleteUserGroupResponse {}